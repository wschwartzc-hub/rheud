<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F8EFE6">
<meta name="color-scheme" content="light">
<title>Rhēud Beauty · Mi cita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  color-scheme:light;
  --ivory:#F8EFE6;--cream:#FCF7F1;--card:#FFFFFF;--wine:#5C2233;--wine-soft:#7A3247;
  --mauve:#9B6A78;--mauve-pale:#E8D5DA;--gold:#C9A86A;--ink:#2E2228;--muted:#9A8C90;
  --line:#EBDFD4;--green:#5B8C6E;--green-bg:#E6F0E9;--red:#B5564E;--red-bg:#F6E4E2;
  --shadow:0 8px 30px rgba(92,34,51,.07);--shadow-lg:0 18px 50px rgba(92,34,51,.14);
}
html{background:#F8EFE6;min-height:100%}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Jost',sans-serif;background:#F8EFE6;color:var(--ink);min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:#F8EFE6;
  background-image:radial-gradient(circle at 12% 8%,rgba(201,168,106,.10),transparent 42%),radial-gradient(circle at 88% 90%,rgba(155,106,120,.10),transparent 45%)}
.wrap{max-width:480px;margin:0 auto;padding:30px 22px 50px;min-height:100vh}
.logo-wrap{text-align:center;margin-bottom:6px}
.logo-wrap img{height:52px;width:auto}
.sub{text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--mauve);font-weight:500;margin-bottom:30px}

/* CARD ENTRADA */
.enter-card{background:var(--card);border-radius:24px;padding:30px 24px;box-shadow:var(--shadow-lg);text-align:center}
.enter-card h1{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;color:var(--wine);margin-bottom:6px;font-weight:600}
.enter-card p{font-size:13.5px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.code-input{width:100%;text-align:center;font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;letter-spacing:4px;color:var(--wine);
  background:var(--cream);border:1.5px solid var(--line);border-radius:15px;padding:16px;text-transform:uppercase;outline:none}
.code-input::placeholder{color:var(--mauve-pale);letter-spacing:3px}
.code-input:focus{border-color:var(--gold)}
.btn{width:100%;border:none;border-radius:15px;padding:16px;font-family:'Jost';font-size:15px;font-weight:600;letter-spacing:.5px;cursor:pointer;transition:.2s;margin-top:14px}
.btn-primary{background:linear-gradient(150deg,var(--wine),var(--mauve));color:#fff;box-shadow:0 8px 22px rgba(92,34,51,.3)}
.btn-primary:active{transform:scale(.98)}
.btn-line{background:var(--card);border:1.5px solid var(--line);color:var(--wine);font-weight:500}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:12px;font-weight:500}

/* CARD CITA */
.appt-card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.appt-hero{background:linear-gradient(150deg,var(--wine),var(--mauve));color:#fff;padding:26px 24px;text-align:center;position:relative}
.appt-hero .code{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-bottom:4px}
.appt-hero .codeval{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;letter-spacing:2px}
.estado-pill{display:inline-block;margin-top:12px;padding:6px 16px;border-radius:30px;font-size:13px;font-weight:600;background:rgba(255,255,255,.9)}
.estado-agendada{color:var(--wine)}
.estado-atendida{color:var(--green)}
.estado-cancelada{color:var(--red)}
.appt-body{padding:24px}
.line{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);gap:14px}
.line:last-child{border-bottom:none}
.line .k{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mauve);font-weight:600;flex:0 0 auto;padding-top:2px}
.line .v{font-size:15px;color:var(--ink);text-align:right;font-weight:400;line-height:1.4}
.line .v.big{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;color:var(--wine)}
.pago-row{margin-top:4px}
.pago-tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:600}
.pago-pagado{background:var(--green-bg);color:var(--green)}
.pago-parcial{background:#E3D2AE;color:#8a6a1e}
.pago-pendiente{background:var(--red-bg);color:var(--red)}
.live{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:18px;font-size:11.5px;color:var(--muted)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.foot{text-align:center;margin-top:24px;font-size:11px;color:var(--muted);letter-spacing:1px}
.qr-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px;margin-top:16px;text-align:center}
.qr-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--wine)}
.qr-sub{font-size:12.5px;color:var(--muted);margin:4px 0 16px}
.loy-qr{display:flex;justify-content:center}
.loy-qr img,.loy-qr canvas{display:block}
.loy-portal{background:linear-gradient(155deg,#FCF7F1,#F3E6DC);border:1px solid var(--gold-soft);border-radius:20px;padding:20px;margin-top:16px}
.lp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lp-head span:first-child{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;color:var(--wine)}
.lp-count{font-size:13px;font-weight:600;color:var(--gold);background:#fff;padding:3px 12px;border-radius:20px}
.lp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:14px}
.p-sello{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold);background:rgba(255,255,255,.4);font-weight:600}
.p-sello.hito{border-style:solid;border-color:var(--gold)}
.p-sello.on{background:linear-gradient(150deg,var(--wine),var(--mauve));border:none;color:#fff;font-size:15px}
.lp-msg{font-size:13.5px;color:var(--wine);font-weight:500;text-align:center;line-height:1.5}
.lp-prizes{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.p-prize{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.6);border-radius:11px;padding:9px 13px;font-size:13px}
.p-prize span{color:var(--mauve);font-weight:600}
.p-prize b{color:var(--ink);font-weight:600}
.back{margin-top:16px}
.spin{width:34px;height:34px;border:3px solid var(--mauve-pale);border-top-color:var(--wine);border-radius:50%;animation:rot .8s linear infinite;margin:30px auto}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>

<script>
const SB_URL='https://wrplznjgravcnxkzfarn.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndycGx6bmpncmF2Y254a3pmYXJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNzM4MDEsImV4cCI6MjA5NTk0OTgwMX0.qEbNOdPQVJ_rsZTdaaTxMx5JpS5qI1wMlbEM7yImq_c';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DOW=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function fmt12(hhmm){if(!hhmm)return null;const [h,m]=hhmm.split(':').map(Number);const ap=h<12?'a.m.':'p.m.';let hh=h%12;if(hh===0)hh=12;return {h:hh+':'+String(m).padStart(2,'0'),ap};}
function fmtFecha(fecha,hora){const d=new Date(fecha+'T00:00:00');let s=DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();const t=fmt12(hora);if(t)s+=' · '+t.h+' '+t.ap;return s;}

let rtChannel=null;let currentCode=null;

async function buscar(){
  const raw=document.getElementById('codeInput').value.trim().toUpperCase();
  const err=document.getElementById('err');err.textContent='';
  if(!raw){err.textContent='Escribe tu código.';return;}
  let code=raw;
  if(!code.startsWith('RH-')){code=code.startsWith('RH')?('RH-'+code.slice(2)):('RH-'+code);}
  const btn=document.getElementById('goBtn');btn.textContent='Buscando…';btn.disabled=true;
  try{
    const {data,error}=await sb.from('citas').select('*').eq('codigo',code).limit(1);
    btn.textContent='Ver mi cita';btn.disabled=false;
    if(error){err.textContent='Hubo un problema. Intenta de nuevo.';return;}
    if(!data||!data.length){err.textContent='No encontramos una cita con ese código.';return;}
    currentCode=code;
    document.getElementById('enterCard').style.display='none';
    render(data[0]);
    subscribe(code);
  }catch(e){btn.textContent='Ver mi cita';btn.disabled=false;err.textContent='Revisa tu conexión.';console.error(e);}
}

function render(c){
  const estado=c.estado||'agendada';
  const estadoTxt={agendada:'Cita agendada',atendida:'Cita atendida',cancelada:'Cita cancelada'}[estado]||estado;
  const items=(c.items||[]).map(i=>i.n).join(' · ')||'Servicio';
  const pagoTag = c.pago==='pagado'
    ? '<span class="pago-tag pago-pagado">Pagado</span>'
    : (c.pago==='parcial'
        ? `<span class="pago-tag pago-parcial">Abonó $${c.abonado||0} · debe $${Math.max(0,(c.precio||0)-(c.abonado||0))}</span>`
        : '<span class="pago-tag pago-pendiente">Pendiente</span>');
  const pagoHtml = estado==='atendida'
    ? `<div class="line pago-row"><span class="k">Pago</span><span class="v">${pagoTag}</span></div>`
    : '';
  const precio = c.precio?`<div class="line"><span class="k">Total</span><span class="v big">$${c.precio}</span></div>`:'';
  document.getElementById('result').innerHTML=`
    <div class="appt-card">
      <div class="appt-hero">
        <div class="code">Código de cita</div>
        <div class="codeval">${c.codigo}</div>
        <div class="estado-pill estado-${estado}">${estadoTxt}</div>
      </div>
      <div class="appt-body">
        <div class="line"><span class="k">Fecha</span><span class="v">${fmtFecha(c.fecha,c.hora)}</span></div>
        <div class="line"><span class="k">Servicio</span><span class="v">${items}</span></div>
        ${precio}
        ${pagoHtml}
        ${c.notas?`<div class="line"><span class="k">Nota</span><span class="v">${c.notas}</span></div>`:''}
        <div class="live"><span class="live-dot"></span>Estado actualizado en tiempo real</div>
      </div>
    </div>
    ${c.clienta_id?`<div id="loyaltyCard"></div>
    <div class="qr-card">
      <div class="qr-title">Tu código de lealtad</div>
      <div class="qr-sub">Muéstralo en el estudio para sumar tu sello 💅</div>
      <div id="loyQr" class="loy-qr"></div>
    </div>`:''}
    <button class="btn btn-line back" onclick="volver()">Consultar otra cita</button>
    <div class="foot">Rhēud Beauty</div>`;
  if(c.clienta_id){
    try{new QRCode(document.getElementById('loyQr'),{text:'RHEUD-CLI:'+c.clienta_id,width:180,height:180,colorDark:'#5C2233',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});}catch(e){console.error(e);}
    loadLoyalty(c.clienta_id);
  }
}
const MAX_SELLOS=12;
async function loadLoyalty(cliId){
  try{
    const {data,error}=await sb.from('clientas').select('sellos,premio_menor_id,premio_mayor_id,menor_canjeado,mayor_canjeado').eq('id',cliId).single();
    if(error||!data)return;
    let premios=[];
    try{const pr=await sb.from('premios').select('id,nombre,nivel');premios=pr.data||[];}catch(e){}
    renderLoyalty(data,premios);
  }catch(e){console.error(e);}
}
function renderLoyalty(d,premios){
  const box=document.getElementById('loyaltyCard');if(!box)return;
  const sellos=Math.min(d.sellos||0,MAX_SELLOS);
  let dots='';
  for(let i=1;i<=MAX_SELLOS;i++){
    const on=i<=sellos;const hito=(i===6||i===12);
    dots+=`<div class="p-sello ${on?'on':''} ${hito?'hito':''}">${on?'✦':(hito?(i===6?'6':'12'):'')}</div>`;
  }
  const faltan6=Math.max(0,6-sellos), faltan12=Math.max(0,12-sellos);
  let msg;
  if(sellos>=12)msg='¡Completaste tu tarjeta! 🏆 Pregunta por tu premio mayor.';
  else if(sellos>=6)msg=`¡Ya tienes tu premio de 6 sellos! 🎁 Te faltan ${faltan12} para el premio mayor.`;
  else msg=`Te faltan ${faltan6} sello${faltan6!==1?'s':''} para tu primer premio 🎁`;
  const pMenor=premios.find(p=>p.id===d.premio_menor_id);
  const pMayor=premios.find(p=>p.id===d.premio_mayor_id);
  let premiosHtml='';
  if(pMenor)premiosHtml+=`<div class="p-prize"><span>🎁 6 sellos</span><b>${pMenor.nombre}${d.menor_canjeado?' ✓':''}</b></div>`;
  if(pMayor)premiosHtml+=`<div class="p-prize"><span>🏆 12 sellos</span><b>${pMayor.nombre}${d.mayor_canjeado?' ✓':''}</b></div>`;
  box.innerHTML=`<div class="loy-portal">
    <div class="lp-head"><span>Tu tarjeta de lealtad</span><span class="lp-count">${sellos}/12</span></div>
    <div class="lp-grid">${dots}</div>
    <div class="lp-msg">${msg}</div>
    ${premiosHtml?`<div class="lp-prizes">${premiosHtml}</div>`:''}
  </div>`;
}

function subscribe(code){
  if(rtChannel)sb.removeChannel(rtChannel);
  rtChannel=sb.channel('portal-'+code)
    .on('postgres_changes',{event:'*',schema:'public',table:'citas',filter:'codigo=eq.'+code},payload=>{
      if(payload.new)render(payload.new);
    }).subscribe();
}

function volver(){
  if(rtChannel){sb.removeChannel(rtChannel);rtChannel=null;}
  document.getElementById('result').innerHTML='';
  document.getElementById('codeInput').value='';
  document.getElementById('enterCard').style.display='block';
}

document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')buscar();});
// permite pasar el código por URL: portal.html?c=RH-7F3K
const params=new URLSearchParams(location.search);
const pre=params.get('c');
if(pre){document.getElementById('codeInput').value=pre.toUpperCase();buscar();}
</script>
