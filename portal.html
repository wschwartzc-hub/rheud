<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F7">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Rhēud Beauty · Mi cita</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#FBF9F7; --card:#FFFFFF; --panel:#F2EEEA; --line:#ECE6E1; --line2:#E3DCD6;
  --ink:#231C1F; --ink2:#3E3540; --muted:#5F565A;
  --wine:#4A1224; --wine-ink:#FFFFFF;
  --nails-bg:#F9E8EE; --nails:#8E2F4E; --nails-ink:#5E1F35;
  --skin-bg:#EEEAF7;  --skin:#4F3F7A;  --skin-ink:#3B2E63;
  --ok-bg:#E4F0E9; --ok:#24573F; --warn-bg:#F7EBD2; --warn:#6B4E10; --bad-bg:#FBE9E6; --bad:#8A2E26;
  --gold:#8A6A1E;
  --r:22px; --r2:14px;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.top img{height:28px;width:auto;display:block}
.top .code{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
h1{font-size:26px;line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;font-weight:800}
.lead{margin-top:6px;font-size:15px;color:var(--ink2)}
.lead b{color:var(--ink)}
/* pasos */
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:18px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.steps li::before{content:"";height:6px;border-radius:3px;background:var(--line2)}
.steps li.done{color:var(--ink);font-weight:800}
.steps li.done::before{background:var(--wine)}
.banner{margin-top:16px;padding:12px 14px;border-radius:var(--r2);font-size:14px;font-weight:700}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
/* servicios */
.svcs{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.svc{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r2)}
.svc.nails{background:var(--nails-bg)} .svc.skin{background:var(--skin-bg)} .svc.otro{background:var(--panel)}
.svc .ic{width:40px;height:40px;flex:none;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.svc .ic svg{width:18px;height:18px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.svc.nails .ic svg{stroke:var(--nails)} .svc.skin .ic svg{stroke:var(--skin)} .svc.otro .ic svg{stroke:var(--ink2)}
.svc .nm{font-size:15px;font-weight:800;min-width:0}
.svc.nails .nm{color:var(--nails-ink)} .svc.skin .nm{color:var(--skin-ink)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.sum .k{font-size:14px;color:var(--muted)}
.sum .v{font-size:18px;font-weight:800;text-align:right}
.sum .v small{display:block;text-align:right;font-size:12px;font-weight:600;color:var(--muted)}
.pay{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:800}
.pay.pagado{background:var(--ok-bg);color:var(--ok)} .pay.parcial{background:var(--warn-bg);color:var(--warn)} .pay.pendiente{background:var(--bad-bg);color:var(--bad)}
/* acciones */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{flex:1 1 140px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border-radius:12px;font:800 14px var(--font);text-decoration:none;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible,.input:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
/* antes de tu cita */
.prep{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.prep li{display:flex;gap:10px;font-size:14px;color:var(--ink2)}
.prep li svg{width:18px;height:18px;flex:none;margin-top:1px;fill:none;stroke:var(--ok);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* sellos */
.loy-head{display:flex;justify-content:space-between;align-items:baseline}
.loy-count{font-size:14px;font-weight:800;color:var(--wine)}
.bar{position:relative;height:10px;margin-top:14px;border-radius:5px;background:var(--panel)}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--wine)}
.bar .mark{position:absolute;left:50%;top:-3px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--gold)}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.marks .m6{color:var(--warn);text-align:center}
.marks .m12{text-align:right}
.loy-msg{margin-top:12px;font-size:14px;color:var(--ink2)}
.qr-row{display:flex;gap:14px;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--panel)}
.qr{width:112px;height:112px;flex:none;padding:6px;border-radius:12px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center}
.qr img,.qr canvas{width:100px!important;height:100px!important;display:block}
.qr-row p{font-size:14px;color:var(--ink2)}
/* entrada de código */
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.input{width:100%;min-height:52px;padding:0 16px;border:1px solid var(--line2);border-radius:14px;background:var(--bg);font:800 22px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.input::placeholder{color:#8B8186;letter-spacing:.08em}
.err{min-height:20px;margin-top:10px;font-size:14px;font-weight:700;color:var(--bad)}
.foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.linkbtn{background:none;border:0;font:800 14px var(--font);color:var(--wine);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 8px}
.spin{width:34px;height:34px;margin:60px auto;border:3px solid var(--panel);border-top-color:var(--wine);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
</style>
<script defer src="vendor/qrcodejs-1.0.0/qrcode.min.js"></script>
<script defer src="js/pagos.js"></script>
<script defer src="js/portal.js"></script>
</head>
<body>
<main class="wrap">
  <header class="top">
    <img src="assets/logo.png" alt="Rhēud Beauty" width="94" height="28">
    <span class="code" id="topCode"></span>
  </header>

  <div id="loading" class="spin" role="status" aria-label="Cargando tu cita"></div>

  <section id="enter" class="card" hidden aria-labelledby="enterTitle">
    <h1 id="enterTitle">Consulta tu cita</h1>
    <p class="lead">Escribe el código que te enviamos por WhatsApp. Lo encuentras como «Código de tu cita».</p>
    <form id="codeForm" novalidate>
      <div class="field">
        <label for="codeInput">Código de cita</label>
        <input class="input" id="codeInput" name="codigo" placeholder="RH-7F3K" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-describedby="err">
      </div>
      <div class="err" id="err" role="alert"></div>
      <div class="actions"><button class="btn primary" type="submit" id="goBtn">Ver mi cita</button></div>
    </form>
  </section>

  <div id="result" hidden></div>

  <footer class="foot" id="foot" hidden>
    <button class="linkbtn" type="button" id="otraBtn">Consultar otra cita</button>
    <span id="updated" aria-live="polite"></span>
  </footer>
</main>
</body>
</html>
